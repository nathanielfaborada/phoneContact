<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="src/view.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

</head>
<body>
    <header id="header">
        <input type="text" id="textInput" placeholder="Search contacts...">
        <button hidden id="addButton" type="button">+</button>
    </header>

    <main>

        <!-- Modal Overlay -->
        <div id="modalOverlay">
            <div id="modalBox">
                <button id="closeModal" type="button">&times;</button>

                <form id="formvalidation">
                    <!-- Avatars are rendered by formadd.js -->
                    <div id="avatarOptions"></div>

                    <div id="inputField">
                        <input type="text" id="link" placeholder="Profile Link Image">
                        <input type="text" id="name" placeholder="Name">
                        <input type="text" id="email" placeholder="Email Address:">
                        <input type="tel" id="number" placeholder="Phone Number">
                    </div>

                    <button type="submit">Add</button>
                    <button type="button" id="resetButton">Reset</button>
                </form>
            </div>
        </div>
        <div id="result">
            <!-- Inserted content here -->

        </div>

        <!-- Details Modal -->
        <div id="detailsOverlay">
            <div id="detailsBox">
                <button id="closeDetails" type="button">&times;</button>

                <!-- View mode -->
                <div id="detailsView">
                    <img id="detailsPhoto" src="" alt="Profile">
                    <h2 id="detailsName"></h2>
                    <p id="detailsNumber"></p>
                    <p id="detailsEmail"></p>
                    <div class="details-actions">
                        <button id="detailsEditBtn" type="button">Update</button>
                        <button id="detailsDeleteBtn" type="button">Delete</button>
                    </div>
                </div>

                <!-- Delete confirmation -->
                <div id="detailsConfirm" style="display:none">
                    <p id="confirmText"></p>
                    <div class="details-actions">
                        <button id="confirmYesBtn" type="button">Yes, Delete</button>
                        <button id="confirmNoBtn"  type="button">Cancel</button>
                    </div>
                </div>

                <!-- Edit mode -->
                <div id="detailsEdit" style="display:none">
                    <form id="editForm">
                        <!-- Avatars rendered by viewContact.js -->
                        <div id="editAvatarOptions"></div>

                        <div id="editInputField">
                            <input type="text" id="editLink"   placeholder="Profile Link Image">
                            <input type="text" id="editName"   placeholder="Name">
                            <input type="text" id="editEmail"  placeholder="Email Address:">
                            <input type="tel"  id="editNumber" placeholder="Phone Number">
                        </div>

                        <button type="submit">Save</button>
                        <button type="button" id="editCancelBtn">Cancel</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

<script type="module" src="./src/add/formadd.js"></script>
<script type="module" src="./src/viewdetails/viewContact.js"></script>

</body>



</html>
